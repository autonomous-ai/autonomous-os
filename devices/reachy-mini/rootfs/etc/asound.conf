# Reachy Mini ALSA aliases — rootfs overlay, copied to /etc/asound.conf.
#
# Recon 2026-07-29 on the Wireless unit (Pollen OS, Debian 13 trixie):
#
#   arecord -l / aplay -l
#     card 0: Audio [Reachy Mini Audio], device 0: USB Audio  <- mic AND speaker
#     card 1: vc4hdmi0                                        <- HDMI, ignore
#     card 2: vc4hdmi1                                        <- HDMI, ignore
#
# Capture and playback are the SAME USB device (Pollen Robotics Reachy Mini
# Audio), so mic and speaker share one clock domain — unlike Lamp, where the two
# sit on separate USB buses and drift apart (see lamp audio topology notes).
#
# That single card exposes exactly ONE playback subdevice ("Subdevices: 0/1" in
# `aplay -l` once anything holds it), so a raw `hw` open is exclusive: whoever
# gets there first locks everyone else out. Pollen's answer is a dmix/dsnoop
# pair, and the definitions below are deliberately byte-identical to theirs in
# ~pollen/.asoundrc — SAME ipc_key, so this attaches to the very same mixing
# instance rather than starting a rival one that would fight for the card.
#
# Why redefine them here at all, when Pollen already ships them: ~/.asoundrc is
# per-user, and HAL runs as root. That worked only while HAL was launched with
# `sudo -E`, which kept HOME=/home/pollen and pulled Pollen's file in by
# accident. Under a systemd unit HAL is root with HOME=/root, the file goes out
# of scope, and ALSA is left with no default and no shared PCM at all:
# PortAudio reports output device -1 and every TTS utterance dies with
# "Error querying device -1", while `aplay` from a login shell still works and
# makes it look like a HAL bug. Measured, same binary, card free either way:
#   HOME=/root          -> sd.default.device [5, -1], output query FAILS
#   HOME=/home/pollen   -> sd.default.device [7,  5], output = reachymini_audio_sink
#
# Cards are addressed by NAME where a raw device is named: the HDMI cards
# register at boot and an index-based alias would move if enumeration order
# changed. The card id is "Audio" (5 chars) so it survives ALSA's 15-character
# card-id truncation.

# --- Shared PCMs (mirror of ~pollen/.asoundrc — keep the ipc_key values) ------

pcm.reachymini_audio_sink {
    type dmix
    ipc_key 4241
    slave {
        pcm "hw:0,0"
        channels 2
        period_size 1024
        buffer_size 4096
        rate 16000
    }
    bindings {
        0 0
        1 1
    }
}

pcm.reachymini_audio_src {
    type dsnoop
    ipc_key 4242
    slave {
        pcm "hw:0,0"
        channels 2
        rate 16000
        period_size 1024
        buffer_size 4096
    }
}

# A default is required, not optional: PortAudio picks its default output from
# this, and with no entry it has none — hence device -1. Safe for the daemon,
# which runs as `pollen` (User=pollen in reachy-mini-daemon.service) and whose
# own ~/.asoundrc is read after /etc/asound.conf, so its default still wins.
# This is only ever seen by users without one of their own — in practice root.
pcm.!default {
    type plug
    slave.pcm "reachymini_audio_sink"
}
ctl.!default { type hw card Audio }

# --- HAL aliases -------------------------------------------------------------
# Every pcm.<alias> gets a matching ctl.<alias>: HAL derives the amixer control
# device from HAL_AUDIO_OUTPUT_ALSA by stripping the plugin prefix
# (hal/routes/audio.py::_amixer_ctl_device), so `plug:device_speaker` becomes
# `amixer -D device_speaker`. Without the ctl entry that call fails with
# "Invalid CTL device_speaker" and volume silently stops working — the API
# answers "No audio mixer controls found" while `amixer` on its own is fine.
#
# Both go through the shared PCMs above rather than straight to `hw`, so HAL,
# the daemon, and a debugging `aplay` can hold the card at the same time.

pcm.device_mic {
    type plug
    slave.pcm "reachymini_audio_src"
}
ctl.device_mic { type hw card Audio }

pcm.device_speaker {
    type plug
    slave.pcm "reachymini_audio_sink"
}
ctl.device_speaker { type hw card Audio }
