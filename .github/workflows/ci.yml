name: CI

on:
  push:
  pull_request:

jobs:
  go:
    name: Go (system) — build · vet · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: build
        run: go build ./...
      # Blocking since 2026-08: the copylocks backlog this step used to only
      # report is gone (config.Load now returns *Config; the domain MQTT-info
      # table holds *config.Config), so `go vet ./...` is clean and any new
      # finding is one this change introduced.
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  web:
    name: Web (system/web) — typecheck · build · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: system/web/package-lock.json
      - name: install
        working-directory: system/web
        run: npm ci
      # `npm run build` runs `tsc -b && vite build`, so it catches type errors
      # and a broken production bundle in one step.
      - name: typecheck + build
        working-directory: system/web
        run: npm run build
      # Blocking since 2026-08: the Monitor/web backlog this step used to only
      # report is cleared (179 findings → 0 errors), so any error here is one
      # the current change introduced. Two `exhaustive-deps` WARNINGS remain on
      # purpose — both fixes would alter render/fetch behavior — and `eslint`
      # exits 0 on warnings, so they report without blocking.
      - name: lint
        working-directory: system/web
        run: npm run lint

  python:
    name: Python (hal) — unit tests · syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Catches refactor-leftover broken imports — including a bare `from devices.x`
      # left over after a module moved (e.g. devices/ -> drivers/camera/), which
      # py_compile and the unit subset both miss because they never execute it.
      # No deps: the moved-import check is stdlib AST (pyflakes undefined-name pass
      # is skipped without the dev extra, so this step can't fail on pre-existing
      # findings and block a merge).
      - name: hal lint (broken / moved-away local imports)
        run: python hal/scripts/lint.py
      - name: unit tests (board + device — no hardware deps)
        run: python -m unittest hal.test.test_board hal.test.test_device hal.test.test_safety -v
      - name: Hermes Jev plugin tests (mock proxy, no credentials)
        run: python -B -m unittest discover -s runtimes/hermes/plugins/jev -p 'test_*.py' -v
      - name: conformance suite (CTS — devices vs COMPATIBILITY.md)
        run: python -m unittest discover -s robots/contract/cts -v
      # Go's TestCatalogMatchesTree only compares the tree against catalog_gen.go.
      # This is the half it cannot see: the SKILLS_CATALOG + skill_caps() block
      # generated into setup.sh, which is what a body seeds from on first boot.
      - name: skill catalog matches the skills/ tree
        run: python3 scripts/skills/gen_catalog.py --check
      - name: syntax check board + drivers
        run: |
          python -m py_compile \
            hal/board/board.py \
            hal/board/device.py \
            hal/drivers/rgb/rgb_service.py \
            hal/drivers/gpio_button.py \
            hal/drivers/ttp223.py
