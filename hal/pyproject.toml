[project]
name = "hal-runtime"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepgram-sdk>=6.0.0",
    "onnxruntime>=1.16.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "feetech-servo-sdk>=1.0.0",
    "lerobot>=0.3.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "livekit-agents[openai]~=1.2",
    "livekit-plugins-noise-cancellation~=0.2",
    "numpy>=2.2.6",
    "pvporcupine>=3.0.5",
    "pvrecorder>=1.2.7",
    "pyarrow==20.0.0",
    "pyaudio>=0.2.14",
    "python-dotenv",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "sounddevice>=0.5.2",
    "webrtcvad>=2.0.10",
    "yt-dlp>=2025.3.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "ultralytics>=8.4,<9",
    "soundfile>=0.12",
    "scipy>=1.8",
    "silero-vad",
    "noisereduce",
    # Pin torchaudio to the torch version resolved per-platform (silero-vad pulls
    # it transitively). Left unconstrained, uv grabs the latest torchaudio, whose
    # aarch64 wheel is CUDA-linked (needs libcudart.so.13) and fails to import on
    # the GPU-less device Pi, breaking the on-device VAD. Markers mirror torch.
    "torchaudio==2.7.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchaudio==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sounddevice",
    "insightface>=0.7.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "onnxruntime>=1.23.2",
    "insightface>=0.7.3",
    "anthropic>=0.40.0",
    "cryptography>=44.0.0",
    "google-genai>=0.7.0",
    "openai>=1.60.0",
    "pydantic>=2.0.0",
    "websockets>=12.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["hal"]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "55198de096f46a8e0447a8795129dd9ee84c088c" }

# Static metadata for sdist-only deps of the `reachy` extra. Without this,
# resolving the lock (on ANY machine, even when the extra is not installed)
# builds pygobject/pycairo from source just to read their metadata — which
# fails wherever cairo/gobject dev libs are absent (lamp images, dev Macs).
# With static metadata uv skips the build at resolve time; the real build
# only happens at install time on a device that selects --extra reachy.
[[tool.uv.dependency-metadata]]
name = "pygobject"
version = "3.46.0"
requires-dist = ["pycairo>=1.16.0"]
requires-python = ">=3.8"

[[tool.uv.dependency-metadata]]
name = "pycairo"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pyflakes>=3.0",
]
hardware = [
    "adafruit-circuitpython-neopixel",
    "adafruit-circuitpython-neopixel-spi",
    "gpiozero",
    "lgpio",
    "rpi-ws281x",
    "spidev",
]
# Reachy Mini body only (devices/reachy-mini) — Pollen's SDK client.
# NOT merged into `hardware`: reachy-mini pulls pygobject/pycairo which build
# from source and need cairo/gobject system libs (present on Pollen's OS,
# absent on lamp images — merging would break lamp OTA).
# Install on-device with: uv sync --extra reachy
reachy = [
    # linux-only marker: the SDK pins onnxruntime==1.27.0 which has no
    # darwin-x86_64 wheels; the extra only ever installs on the robot's Pi.
    "reachy-mini>=1.9; sys_platform == 'linux'",
]
