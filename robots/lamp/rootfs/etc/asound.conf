# Persistent ALSA aliases for lamp-ac82 (Orange Pi 4 Pro, A733 / T527).
# Speaker:  TTGK USB Audio (device_speaker, renamed via udev).
# Micro1:   C-Media USB Audio Adapter (device_micro1, renamed via udev
#           by vid:pid 0d8c:0014) for sensing/wake. Replaced the ES8389
#           onboard codec (sndi2s4) on 2026-09-17.
# Micro2:   Jieli USB Composite Device (device_micro2, renamed via udev) for STT.
# Micro3:   SunplusIT OPENAICAM built-in mic (device_micro3, renamed via udev).
#
# Card ids are role-based and kept <=15 chars (kernel snd_card.id limit). The
# card id matches its pcm alias name (separate ALSA namespaces, so this is valid).

pcm.device_speaker {
    type plug
    slave.pcm {
        type hw
        card device_speaker
        device 0
    }
}
ctl.device_speaker { type hw card device_speaker }

pcm.device_micro1 {
    type plug
    slave.pcm {
        type hw
        card device_micro1
        device 0
    }
    route_policy average
}
ctl.device_micro1 { type hw card device_micro1 }

pcm.device_micro2 {
    type plug
    slave.pcm {
        type hw
        card device_micro2
        device 0
    }
}
ctl.device_micro2 { type hw card device_micro2 }

pcm.device_micro3 {
    type plug
    slave.pcm {
        type hw
        card device_micro3
        device 0
    }
}
ctl.device_micro3 { type hw card device_micro3 }

pcm.!default {
    type asym
    playback.pcm "device_speaker"
    capture.pcm "device_micro2"
}
ctl.!default { type hw card sndi2s4 }
