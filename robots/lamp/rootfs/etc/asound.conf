# Persistent ALSA aliases for the lamp (Orange Pi 4 Pro, A733 / T527).
# Final hardware fit, recorded from lamp-4ace on 2026-09-18:
# Speaker:  C-Media USB Audio Adapter (0d8c:0014), the playback side of the
#           same card as Micro1 — one card, two roles (capture=device_micro1,
#           playback=device_speaker). No separate USB speaker is fitted; the
#           earlier TTGK USB speaker role is gone.
# Micro1:   C-Media USB Audio Adapter (device_micro1, renamed via udev
#           by vid:pid 0d8c:0014) for sensing/wake. Replaced the ES8389
#           onboard codec (sndi2s4) on 2026-09-17.
# Micro2:   Jieli USB Composite Device (device_micro2, renamed via udev) for STT.
#
# Card ids are role-based and kept <=15 chars (kernel snd_card.id limit). The
# card id matches its pcm alias name (separate ALSA namespaces, so this is valid).
pcm.device_speaker {
    type plug
    slave.pcm {
        type hw
        card device_micro1
        device 0
    }
}
ctl.device_speaker { type hw card device_micro1 }

pcm.device_micro1 {
    type plug
    slave.pcm {
        type hw
        card device_micro1
        device 0
    }
    route_policy average
}
ctl.device_micro1 { type hw card device_micro1 }

pcm.device_micro2 {
    type plug
    slave.pcm {
        type hw
        card device_micro2
        device 0
    }
}
ctl.device_micro2 { type hw card device_micro2 }


pcm.!default {
    type asym
    playback.pcm "device_speaker"
    capture.pcm "device_micro2"
}
ctl.!default { type hw card sndi2s4 }
