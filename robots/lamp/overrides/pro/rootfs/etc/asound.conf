# Lamp Pro: Standard microphones with ReSpeaker Lite speaker output.
# Voice/STT: Jieli USB card device_micro2; sensing: C-Media device_cmedia.
# Speaker routing and its 35% volume policy remain the Lite configuration.
# The separate microphones need HAL software AEC; they do not use Lite capture.
#
# The card exposes no ALSA mixer controls, so speaker volume is a softvol stage
# ("Speaker", 0-100 = -40..0 dB) in front of dmix. HAL /audio/volume reaches it
# through ctl.device_speaker. The control only exists after the first PCM open;
# respeaker-lite-softvol.service (udev-triggered) does that at boot so the boot
# volume restore has something to write to.
pcm.respeaker_playback_shared {
    type dmix
    ipc_key 5838001
    ipc_perm 0666
    slave {
        pcm "hw:Lite,0"
        rate 16000
        channels 2
        period_size 320
        buffer_size 1280
    }
}
pcm.respeaker_playback_vol {
    type softvol
    slave.pcm "respeaker_playback_shared"
    control { name "Speaker Playback Volume" card Lite }
    min_dB -40.0
    max_dB 0.0
    resolution 101
}
pcm.device_speaker { type plug slave.pcm "respeaker_playback_vol" }
ctl.device_speaker { type hw card Lite }

# Microphone routes match the Standard profile.
pcm.device_micro1 {
    type plug
    slave.pcm {
        type hw
        card device_cmedia
        device 0
    }
    route_policy average
}
ctl.device_micro1 { type hw card device_cmedia }

pcm.device_micro2 {
    type plug
    slave.pcm {
        type hw
        card device_micro2
        device 0
    }
}
ctl.device_micro2 { type hw card device_micro2 }


pcm.!default {
    type asym
    playback.pcm "device_speaker"
    capture.pcm "device_micro2"
}
ctl.!default { type hw card Lite }
