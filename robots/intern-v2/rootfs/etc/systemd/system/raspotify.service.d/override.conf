[Service]
# HAL owns raw ALSA (hw:sndi2s4). Route through HAL's pulseaudio so both
# music and TTS mix onto the same physical speaker. Socket is world-writable
# so cross-user access does not need extra group juggling.
Environment=PULSE_SERVER=unix:/tmp/pulse-anon-intern-v2
Environment=LIBRESPOT_BACKEND=pulseaudio
Environment="LIBRESPOT_NAME=Intern 2"
Environment=LIBRESPOT_BITRATE=320
Environment=LIBRESPOT_INITIAL_VOLUME=80
# Reuse the cache we wrote during the one-time OAuth flow so the service
# starts already-authenticated and appears in the Cloud device list without
# a zeroconf claim.
Environment=LIBRESPOT_CACHE=/var/cache/raspotify
Environment=LIBRESPOT_SYSTEM_CACHE=/var/cache/raspotify

# Raspotify runs with PrivateTmp=yes, so /tmp/pulse-anon-intern-v2 in its
# namespace is a fresh empty dir — that is the real reason PulseAudioSink
# got Connection refused. Disable PrivateTmp for this unit so the HAL pulse
# socket is reachable. (BindPaths= would be tighter but the pulse socket is
# already the only /tmp file we need — no security gain in isolating a dir
# with a single well-known socket.)
PrivateTmp=no

# Pin librespot's PulseAudio output to the raw speaker sink (Sink #0). The
# default sink is aec_sink (echo-cancelled — meant for voice + AEC on the
# mic path). Music routed there was inaudible on the physical speaker;
# routing directly to alsa_output bypasses the AEC loop.
Environment=LIBRESPOT_DEVICE=alsa_output.platform-soc_3000000_i2s3_mach.stereo-fallback
