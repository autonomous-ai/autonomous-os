worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Carry an inbound X-Request-ID through the whole chain, or mint one. This is
    # what makes a failure greppable across nginx -> lbserver -> dlserver instead
    # of needing wall-clock correlation across four separate logs.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ''      $request_id;
    }

    # $upstream_status is the discriminator that tells the three failure shapes apart:
    #   client=504 upstream=-   backend hung   (accepted the connection, never replied)
    #   client=502 upstream=-   backend down   (connect refused)
    #   no line at all          never reached this box (Cloudflare / ingress / caller)
    log_format upstream_detail
        '$remote_addr $host "$request" '
        'client=$status upstream=$upstream_status '
        'rt=$request_time urt=$upstream_response_time '
        'addr=$upstream_addr rid=$req_id "$http_user_agent"';

    access_log /var/log/nginx/access.log upstream_detail;
    error_log /var/log/nginx/error.log;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8899 ssl;
        server_name _;

        ssl_certificate /workspace/ssl/cert.pem;
        ssl_certificate_key /workspace/ssl/key.pem;

        client_max_body_size 50M;

        # All traffic → port 7999 (LB on master, dlserver on slave)
        location / {
            proxy_pass http://127.0.0.1:7999/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $req_id;
            add_header X-Request-ID $req_id always;
            # Must exceed lb.http_timeout (30s) so lbserver fails first and can
            # attribute the failure to its backend. Equal timeouts are a race.
            proxy_connect_timeout 5s;
            proxy_read_timeout 45s;
            proxy_send_timeout 45s;
        }

        location /lelamp/ {
            proxy_pass http://127.0.0.1:7999/hal/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $req_id;
            add_header X-Request-ID $req_id always;
            # Must exceed lb.http_timeout (30s) so lbserver fails first and can
            # attribute the failure to its backend. Equal timeouts are a race.
            proxy_connect_timeout 5s;
            proxy_read_timeout 45s;
            proxy_send_timeout 45s;
        }

        location /jupyter/ {
            proxy_pass http://127.0.0.1:8890/jupyter/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $req_id;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
